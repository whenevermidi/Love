<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Surprise for You 🌸</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        background: #fff0f6;
        font-family: "Georgia", serif;
        text-align: center;
        color: #b30059;
    }

    h1 {
        margin-bottom: 10px;
    }

    /* Blooming flower container */
    .flower {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 20px auto;
        animation: bloom 3s ease-out forwards;
        transform: scale(0);
    }

    @keyframes bloom {
        0% { transform: scale(0); }
        60% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    /* Petals */
    .petal {
        position: absolute;
        width: 60px;
        height: 90px;
        background: #ff6fa8;
        border-radius: 50px 50px 0 0;
        transform-origin: bottom center;
        opacity: 0;
        animation: petalFade 2s forwards;
    }

    @keyframes petalFade {
        0% { opacity: 0; transform: scale(0.5); }
        100% { opacity: 1; transform: scale(1); }
    }

    .p1 { transform: rotate(0deg) translateY(-20px); animation-delay: 0.3s; }
    .p2 { transform: rotate(72deg) translateY(-20px); animation-delay: 0.5s; }
    .p3 { transform: rotate(144deg) translateY(-20px); animation-delay: 0.7s; }
    .p4 { transform: rotate(216deg) translateY(-20px); animation-delay: 0.9s; }
    .p5 { transform: rotate(288deg) translateY(-20px); animation-delay: 1.1s; }

    /* Flower center */
    .center {
        position: absolute;
        width: 55px;
        height: 55px;
        background: #ffcc33;
        border-radius: 50%;
        top: 47px;
        left: 47px;
        opacity: 0;
        animation: centerFade 2s forwards 1.3s;
    }

    @keyframes centerFade {
        0% { opacity: 0; transform: scale(0.5); }
        100% { opacity: 1; transform: scale(1); }
    }

    #canvasContainer {
        margin-top: 40px;
    }

    a {
        display: inline-block;
        margin-top: 25px;
        padding: 10px 20px;
        background: #ff6f91;
        color: white;
        border-radius: 8px;
        text-decoration: none;
    }
</style>
</head>
<body>

<h1>For You, My Love 🌹</h1>

<h2>A flower that blooms just for you</h2>

<div class="flower">
    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="center"></div>
</div>

<h2>A heart, drawn just for you 💗</h2>

<div id="canvasContainer">
    <canvas id="heartCanvas" width="400" height="400"></canvas>
</div>

<h3>You deserve all the love in the world.</h3>

<a href="Love.html">Back</a>

<script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    ctx.translate(200, 200);
    ctx.scale(10, -10);

    ctx.beginPath();
    for (let t = 0; t < Math.PI * 2; t += 0.01) {
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        ctx.lineTo(x, y);
    }

    ctx.strokeStyle = "#ff0066";
    ctx.lineWidth = 0.3;
    ctx.stroke();
</script>

</body>
</html>
