<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        font-family: "Georgia", serif;
        overflow: hidden;
    }

    #container {
        width: 80%;
        max-width: 650px;
        height: 80vh;
        padding: 20px;
        background: rgba(255,255,255,0.4);
        border-radius: 12px;
        overflow-y: auto;
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
        text-align: center;
        color: #4a2c2a;
        font-size: 1.3rem;
        line-height: 1.6;
    }

    #message {
        border-right: 3px solid rgba(0,0,0,0.5);
        white-space: pre-wrap;
        overflow: hidden;
        margin-bottom: 20px;
        min-height: 150px;
    }

    button {
        padding: 12px 25px;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        background: #ff6f91;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #ff3f6c;
    }

    .heart {
        position: fixed;
        bottom: -10px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 20px;
        animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
    }
</style>
</head>
<body>

<div id="container">
    <div id="message"></div>
    <button onclick="goToSurprise()">Click for a surprise</button>
</div>

<script>
    const text = 
`Mooiiiiiiiiii love!!!!,

Mitä menee?? 
It's been a month since vappuu and since the day we officially started dating. YAY!! It feels like a long time but it has just been a month and we have had so many fun experience. 
I did not want to make something too big so i made this simple site. Wooooooooooo!! 

I just wanted you to know that i might not be the best boyfriend but I will do my best to make sure that you are happy and not hurt. The whole month has been ups and downs emotionally and physically. We have gone through many miscommunications and I apologize for causing many of it. 
We have learnt so much about each other in just a month that it's astounding. I love you from the deepest part of my heart and you mean the world to me!! 

We both are trying our best to go through tough times in each of our lives and it's tough to handle everything all at once. So, Me being your boyfriend, I want you to try to lean on me and ask for help whenever you need; even somethings that are very minute things cuz i want to help you in any way I can.

Speaking of which, you are doing your best and it truly shows. You need to try to chill bbg. You are doing amazing and I am so so SOOOO proud of you. You are taking steps to better your lifestyle and I really admire that part of you!! You have pushed me towards something better beyond belief. 
There are ofcourse things that we cannot control and I know that you are aware of it but I think that you still stress about those stuffs in the back of your mind. So chill babe. You are amazing, you are beautiful and you are doing GREAT!!

As a friend and your boyfriend, 
I Love You!! 

We are going to meet later today but I am going to say it here as well. I hope this continues and I hope i am being atleast good towards you and making you happy!!`;

    let i = 0;
    function typeWriter() {
        if (i < text.length) {
            document.getElementById("message").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 25); // faster typing
        }
    }
    typeWriter();

    function goToSurprise() {
        window.location.href = "surprise.html";
    }

    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (20 + Math.random() * 20) + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
    }, 500);
</script>

</body>
</html>
